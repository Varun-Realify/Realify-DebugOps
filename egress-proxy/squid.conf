# Egress allowlist for sandbox containers. Sandboxes sit on an internal-only network; this proxy is
# their only route out, and only to domains in allowlist.txt over HTTPS (CONNECT 443) or HTTP.
http_port 3128
pid_filename none
cache deny all
cache_dir null /tmp
coredump_dir /tmp
logfile_rotate 0
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr

acl allowed dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
